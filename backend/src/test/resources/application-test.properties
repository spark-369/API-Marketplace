# =============================================================================
# Test profile
#   Keeps the suite runnable with no external infrastructure: an in-memory cache
#   replaces Redis, Hibernate creates a throwaway schema in H2, and JobRunr's
#   background server is disabled so no shared Redis instance is required.
# =============================================================================

spring.datasource.url=jdbc:h2:mem:api_marketplace_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# In-memory cache keeps the caching annotations active without a Redis dependency.
spring.cache.type=simple

# JobRunr needs a StorageProvider; disabling the server avoids requiring Redis in unit runs.
# The fail-fast guard added in JobRunrConfig is opted out here, because the suite deliberately
# runs with no background job server — tests assert service behaviour directly rather than
# through the queue.
jobrunr.background-job-server.enabled=false
jobrunr.dashboard.enabled=false
app.jobrunr.fail-fast-when-server-disabled=false

app.jwt.secret=test-secret-value-that-is-long-enough-for-hs256-32
app.jwt.expiration-ms=3600000
app.cors.allowed-origins=http://localhost:5173
app.ratelimit.fail-open=true
app.gateway.allowed-hosts=
app.pagination.max-page-size=50

logging.level.root=WARN
logging.level.com.am.backend=INFO
