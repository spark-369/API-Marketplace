spring.application.name=api-marketplace

# =============================================================================
# Server
# =============================================================================
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Request size caps: the gateway forwards bodies, so this is a real resource limit.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=10MB

# =============================================================================
# Datasource (PostgreSQL + HikariCP)
# =============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/api_marketplace}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:mysecretpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECT_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.pool-name=ApiMarketplacePool
spring.datasource.hikari.leak-detection-threshold=60000

# =============================================================================
# JPA / Hibernate
# =============================================================================
# ddl-auto=update is a development convenience ONLY. There is no prod profile file in this
# repository: production settings are supplied entirely through environment variables, and a
# production deployment MUST set DB_DDL_AUTO=validate so schema drift fails fast at boot.
# update can never drop or narrow a column and silently diverges from the entity model over
# time, which is why a versioned migration tool is a pending P0 (see System Blueprint gap #1).
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# =============================================================================
# Redis (cache + rate limiting + JobRunr storage)
# =============================================================================
# All three concerns share ONE logical Redis instance/database here. Two consequences:
#   1. An eviction policy other than noeviction will EVICT JobRunr job records under memory
#      pressure, so queued jobs (including "Persist usage log") are lost before they run.
#      The bundled compose file sets noeviction deliberately; a managed Redis must match it.
#   2. Cache, rate-limit counters and job records are not isolated. Give JobRunr its own logical
#      database (spring.data.redis.database / jobrunr.database.*) rather than sharing one.
# spring.data.redis.password MUST be set whenever the target Redis requires auth; an empty value
# here silently produces connection failures that surface as cache/rate-limit/job errors.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms
spring.data.redis.client-type=lettuce
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# =============================================================================
# Cache
# =============================================================================
# The application supplies its own RedisCacheManager bean (RedisCacheConfig) with a custom
# ObjectMapper (default typing enabled, allow-listed types) and a versioned key prefix.
#
# IMPORTANT: "redis" is required here so Spring Boot wires the Redis-backed CacheManager rather
# than a no-op one. The custom bean declared in RedisCacheConfig takes precedence over Boot's
# auto-configured manager, so the serializer used for writes and reads is always the application's.
#
# If cache GETs start failing with "missing type id property '@class'" or
# "Unexpected token (START_OBJECT)", that means entries serialised by a DIFFERENT form are being
# read. Those are stale entries from an older deployment: the fix is to bump KEY_PREFIX in
# RedisCacheConfig (e.g. am:cache:v3:) so every pre-existing key is never looked up again,
# instead of being read, found unreadable, and evicted one request at a time.
#
# Set CACHE_TYPE=none to disable caching entirely (e.g. troubleshooting a suspected cache issue).
spring.cache.type=${CACHE_TYPE:redis}

# =============================================================================
# JobRunr (background jobs)
# =============================================================================
# STORAGE: JobRunr auto-detects its StorageProvider. With both a DataSource and Redis on the
# classpath it would pick SQL silently, so the choice is pinned here: jobs live in the application
# PostgreSQL database, under the jobrunr_* tables (jobrunr_jobs, jobrunr_backgroundjobservers, ...).
# To diagnose a stuck queue, query those tables — NOT redis-cli 'jobrunr:*', which is always empty
# in this configuration.
#
# skip-create=false lets JobRunr create its own tables on first use. A database user without DDL
# rights will fail loudly at startup rather than silently dropping telemetry.
jobrunr.database.type=sql
jobrunr.database.skip-create=false

# The gateway persists usage_logs via a background job, so JOBRUNR_SERVER_ENABLED=false means
# gateway requests are served normally while NO telemetry rows are ever written (jobs are
# enqueued but nothing processes them). The application refuses to start in that combination;
# set app.jobrunr.fail-fast-when-server-disabled=false to run an API-only instance behind a
# separate worker. The database must be reachable at boot: JobRunr runs its own migrations on
# startup ("Waiting for database migrations to finish...").
jobrunr.background-job-server.enabled=${JOBRUNR_SERVER_ENABLED:true}
app.jobrunr.fail-fast-when-server-disabled=${JOBRUNR_FAIL_FAST:true}
jobrunr.dashboard.enabled=${JOBRUNR_DASHBOARD_ENABLED:true}
jobrunr.dashboard.port=${JOBRUNR_DASHBOARD_PORT:8000}
jobrunr.jobs.default-number-of-retries=3
jobrunr.jobs.retry-back-off-time-seed=3
jobrunr.background-job-server.worker-count=4
jobrunr.background-job-server.poll-interval-in-seconds=15

# =============================================================================
# Application: JWT
# =============================================================================
# MUST be overridden in every non-local environment. HS256 requires >= 32 bytes.
# NOTE: this is only a *default*; nothing enforces the override, so a misconfigured deployment
# will boot silently with a publicly-known signing key. Treat a missing JWT_SECRET env var as a
# deployment error, and never reuse this value outside local development.
app.jwt.secret=${JWT_SECRET:change-me-please-use-a-long-random-secret-32chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =============================================================================
# Application: CORS
# =============================================================================
# Comma-separated allow-list. "*" is acceptable for local development only and is
# never combined with credentials.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# =============================================================================
# Application: rate limiting
# =============================================================================
app.ratelimit.default-limit=${RATE_LIMIT_DEFAULT:60}
app.ratelimit.default-period=${RATE_LIMIT_PERIOD:MINUTE}
app.ratelimit.default-period-seconds=${RATE_LIMIT_PERIOD_SECONDS:60}
# true  = allow the request when Redis is unavailable (free tiers, availability first)
# false = reject with 429 when Redis is unavailable (paid tiers, enforcement first)
app.ratelimit.fail-open=${RATE_LIMIT_FAIL_OPEN:true}

# =============================================================================
# Application: gateway / SSRF controls
# =============================================================================
app.gateway.connect-timeout-ms=${GATEWAY_CONNECT_TIMEOUT_MS:10000}
app.gateway.read-timeout-ms=${GATEWAY_READ_TIMEOUT_MS:30000}
app.gateway.max-response-body-bytes=${GATEWAY_MAX_RESPONSE_BYTES:1048576}
# Comma-separated host allow-list. Empty means "any host that passes IP screening".
# Empty is acceptable for local development only. A production deployment MUST set an explicit
# list; otherwise the gateway will attempt any publicly-routable host a provider's baseUrl names
# (SSRF screening still rejects private/loopback/link-local ranges, but the host set stays open).
app.gateway.allowed-hosts=${GATEWAY_ALLOWED_HOSTS:}

# =============================================================================
# Application: pagination guard rails
# =============================================================================
app.pagination.max-page-size=${MAX_PAGE_SIZE:100}

# =============================================================================
# Application: usage-log retention (consumed by the nightly JobRunr job)
# =============================================================================
# NOTE: usage_logs is written ONLY by the asynchronous "Persist usage log" JobRunr job that the
# gateway enqueues after a successful /api/gateway/forward/{apiId} request. An empty table
# therefore means either (a) no gateway traffic was sent, or (b) the job never ran (worker
# disabled, job evicted from Redis, or the key no longer existed when the job executed) — see the
# JobRunr and Redis blocks above. Retention below only DELETES rows older than the window.
app.usage.retention-days=${USAGE_RETENTION_DAYS:90}

# =============================================================================
# Actuator
# =============================================================================
management.endpoints.web.exposure.include=${ACTUATOR_EXPOSURE:health,info}
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:when_authorized}
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# =============================================================================
# OpenAPI / Swagger UI
# =============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# =============================================================================
# Logging
# =============================================================================
logging.level.root=INFO
logging.level.com.am.backend=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
